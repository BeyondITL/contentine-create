name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue! A maintainer will triage it soon.
            If you'd like to work on it, comment /claim and it's yours.
            See CONTRIBUTING.md for setup and the quality bar.
          pr-message: >
            Thanks for your first pull request! Maintainers aim to give a first response within 2 working days.
            Please make sure the checks pass and you've followed CONTRIBUTING.md — including
            the MP4-evidence rule for any render/generation flow. Welcome aboard. 🎬
