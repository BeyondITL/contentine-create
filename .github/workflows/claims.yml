name: Claims

# Lets contributors claim an issue by commenting `/claim`, hand it back with
# `/unclaim`, and frees claims that go quiet for 7 days. See CONTRIBUTING.md
# ("How to claim an issue").

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "23 4 * * *" # daily sweep of stale claims
  workflow_dispatch:

permissions:
  issues: write

jobs:
  command:
    name: Handle /claim and /unclaim
    if: >-
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    concurrency:
      group: claims-${{ github.event.issue.number }}
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue = context.payload.issue;
            const commenter = context.payload.comment.user.login;
            const command = context.payload.comment.body.trim().split(/\r?\n/)[0].trim().toLowerCase();
            if (command !== '/claim' && command !== '/unclaim') return;
            if (issue.state !== 'open') return;

            const issue_number = issue.number;
            const assignees = (issue.assignees || []).map((a) => a.login);
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number, body });
            // Hidden marker the daily sweep uses to tell bot claims from manual assignments.
            const marker = (login) => `<!-- claim-bot:claimed @${login} -->`;

            if (command === '/claim') {
              if (assignees.includes(commenter)) {
                await reply(`@${commenter} this one is already yours.`);
                return;
              }
              if (assignees.length > 0) {
                const names = assignees.map((a) => `@${a}`).join(', ');
                await reply(
                  `Thanks for offering, @${commenter}! This issue is already claimed by ${names}. ` +
                  `If it goes quiet for 7 days it frees up automatically, or have a look at the other open issues in the meantime.`
                );
                return;
              }
              const { data } = await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [commenter] });
              // GitHub silently drops assignees it cannot assign; check rather than assume.
              if (!(data.assignees || []).some((a) => a.login === commenter)) {
                await reply(`Sorry @${commenter}, GitHub would not let me assign this issue to you. A maintainer will sort it out.`);
                core.setFailed(`Could not assign ${commenter} to #${issue_number}`);
                return;
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['claimed'] });
              await reply(
                `${marker(commenter)}\n` +
                `It's yours, @${commenter}, welcome aboard!\n\n` +
                `- Open a **draft PR** as soon as you have something to show (link this issue with \`Closes #${issue_number}\`).\n` +
                `- If there is no linked PR and no update from you here for **7 days**, the claim is released so someone else can pick it up. A quick comment keeps it.\n` +
                `- Changed your mind? Comment \`/unclaim\` to hand it back, no hard feelings.\n\n` +
                `Setup and the quality bar are in [CONTRIBUTING.md](${context.serverUrl}/${owner}/${repo}/blob/HEAD/CONTRIBUTING.md).`
              );
              return;
            }

            // /unclaim: only the current assignee can hand the issue back.
            if (!assignees.includes(commenter)) {
              await reply(`@${commenter} you are not assigned to this issue, so there is nothing to unclaim.`);
              return;
            }
            await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [commenter] });
            if (assignees.length === 1) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'claimed' }).catch((err) => {
                if (err.status !== 404) throw err; // label already gone is fine
              });
            }
            await reply(`Thanks @${commenter}, you're unassigned and this issue is open for someone else to \`/claim\`.`);

  sweep:
    name: Release stale claims
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: claims-sweep
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const STALE_MS = 7 * 24 * 60 * 60 * 1000;
            const now = Date.now();
            const BOT = 'github-actions[bot]';

            const issues = (await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: 'claimed', per_page: 100,
            })).filter((i) => !i.pull_request);

            for (const issue of issues) {
              const issue_number = issue.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, { owner, repo, issue_number, per_page: 100 });

              // Any open PR (draft included) that references the issue keeps every claim alive.
              const hasOpenPr = timeline.some((e) =>
                e.event === 'cross-referenced' && e.source?.issue?.pull_request && e.source.issue.state === 'open'
              );
              if (hasOpenPr) continue;

              const remaining = issue.assignees.map((a) => a.login);
              for (const login of issue.assignees.map((a) => a.login)) {
                // Only release claims the bot made; manual maintainer assignments are left alone.
                const claims = comments.filter((c) => c.user.login === BOT && c.body.includes(`<!-- claim-bot:claimed @${login} -->`));
                if (claims.length === 0) continue;
                const claimedAt = Date.parse(claims[claims.length - 1].created_at);
                const ownComments = comments.filter((c) => c.user.login === login).map((c) => Date.parse(c.created_at));
                const lastActivity = Math.max(claimedAt, ...ownComments);
                if (now - lastActivity < STALE_MS) continue;

                await github.rest.issues.removeAssignees({ owner, repo, issue_number, assignees: [login] });
                remaining.splice(remaining.indexOf(login), 1);
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: `@${login} there has been no linked PR or update here for 7 days, so I've released your claim. ` +
                        `Thanks for your interest! You're welcome to \`/claim\` it again if you pick it back up. ` +
                        `This issue is free for anyone to \`/claim\`.`,
                });
                core.info(`Released #${issue_number} from ${login}`);
              }
              if (remaining.length === 0) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'claimed' }).catch((err) => {
                  if (err.status !== 404) throw err;
                });
              }
            }
