# Source of truth for the repo's issue/PR labels. Synced to GitHub by
# .github/workflows/labels.yml on push to main. Sync only creates and updates;
# it never deletes a label that is missing from this file.

# Type
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"
- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"
- name: "question"
  color: "d876e3"
  description: "Further information is requested"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Dependabot)"

# Area
- name: "engine"
  color: "00c3ff"
  description: "Browser-native AI or render engines (frontend/src/engine)"
- name: "ui"
  color: "f3a6ff"
  description: "User interface and components"
- name: "accessibility"
  color: "5319e7"
  description: "Keyboard, screen reader, focus, and labelling"
- name: "testing"
  color: "35c838"
  description: "Tests, harnesses, and verification"

# Contributor workflow
- name: "good first issue"
  color: "7057ff"
  description: "Small and well-scoped; little project context needed"
- name: "help wanted"
  color: "008672"
  description: "Clearly scoped and open for a contributor to pick up"
- name: "claimed"
  color: "fbca04"
  description: "Someone is working on this (see /claim in CONTRIBUTING.md)"
- name: "level: 1"
  color: "c2e0c6"
  description: "First contribution: one file or component, with a test command"
- name: "level: 2"
  color: "5fb878"
  description: "Wiring or hardening across a few files"
- name: "level: 3"
  color: "0e8a16"
  description: "Open hard problem (see ROADMAP.md)"

# Triage and resolution
- name: "needs-triage"
  color: "ededed"
  description: "Not yet reviewed by a maintainer"
- name: "blocked"
  color: "b60205"
  description: "Waiting on another issue, decision, or upstream change"
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
