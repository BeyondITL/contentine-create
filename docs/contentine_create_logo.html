<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contentine Create — Logo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0C0C0C;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  /* Ambient background glow */
  .ambient {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    z-index: 0;
    animation: ambientDrift 12s ease-in-out infinite;
  }
  .ambient-1 { background: #00C3FF; top: -200px; left: -100px; animation-delay: 0s; }
  .ambient-2 { background: #F3A6FF; bottom: -200px; right: -100px; animation-delay: -4s; }
  .ambient-3 { background: #35C838; top: 50%; left: 50%; transform: translate(-50%,-50%); animation-delay: -8s; }
  
  @keyframes ambientDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -20px) scale(1.1); }
    66% { transform: translate(-20px, 30px) scale(0.9); }
  }

  .logo-container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* 3D Logo Mark */
  .logo-mark {
    position: relative;
    width: 220px;
    height: 165px;
    perspective: 800px;
    cursor: pointer;
  }

  .logo-mark svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 30px rgba(0,195,255,0.3))
           drop-shadow(0 0 60px rgba(243,166,255,0.15));
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite;
  }

  .logo-mark:hover svg {
    transform: rotateY(15deg) rotateX(-5deg) scale(1.05);
    filter: drop-shadow(0 0 40px rgba(0,195,255,0.5))
           drop-shadow(0 0 80px rgba(243,166,255,0.3));
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotateY(0deg); }
    25% { transform: translateY(-8px) rotateY(3deg); }
    50% { transform: translateY(-4px) rotateY(0deg); }
    75% { transform: translateY(-10px) rotateY(-3deg); }
  }

  /* Animated gradient */
  @keyframes gradientShift {
    0% { stop-color: #00C3FF; }
    33% { stop-color: #35C838; }
    66% { stop-color: #F3A6FF; }
    100% { stop-color: #00C3FF; }
  }
  @keyframes gradientShift2 {
    0% { stop-color: #F3A6FF; }
    33% { stop-color: #00C3FF; }
    66% { stop-color: #35C838; }
    100% { stop-color: #F3A6FF; }
  }
  @keyframes gradientShift3 {
    0% { stop-color: #35C838; }
    33% { stop-color: #F3A6FF; }
    66% { stop-color: #00C3FF; }
    100% { stop-color: #35C838; }
  }

  /* Shine sweep */
  @keyframes shineSweep {
    0% { transform: translateX(-200%) rotate(25deg); }
    100% { transform: translateX(200%) rotate(25deg); }
  }

  .shine-layer {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    pointer-events: none;
    border-radius: 20px;
  }

  .shine-layer::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 40%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    animation: shineSweep 4s ease-in-out infinite;
    animation-delay: 2s;
  }

  /* Wordmark */
  .wordmark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .wordmark-main {
    font-size: 48px;
    font-weight: 800;
    letter-spacing: -1.5px;
    background: linear-gradient(135deg, #00C3FF 0%, #66DAFF 25%, #F3A6FF 50%, #35C838 75%, #00C3FF 100%);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: textGradient 8s ease-in-out infinite;
    text-shadow: none;
    position: relative;
  }

  @keyframes textGradient {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .wordmark-sub {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }

  /* Tagline */
  .tagline {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
    margin-top: 8px;
  }

  /* Orb decorations */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(1px);
    opacity: 0.6;
    animation: orbFloat 8s ease-in-out infinite;
  }
  .orb-1 { width: 6px; height: 6px; background: #00C3FF; top: -20px; left: 30%; animation-delay: 0s; }
  .orb-2 { width: 4px; height: 4px; background: #F3A6FF; top: 40%; right: -15px; animation-delay: -2s; }
  .orb-3 { width: 5px; height: 5px; background: #35C838; bottom: -15px; left: 60%; animation-delay: -4s; }
  .orb-4 { width: 3px; height: 3px; background: #00C3FF; top: 60%; left: -10px; animation-delay: -6s; }
  
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0); opacity: 0.6; }
    25% { transform: translate(10px, -15px); opacity: 1; }
    50% { transform: translate(-5px, -25px); opacity: 0.3; }
    75% { transform: translate(15px, -10px); opacity: 0.8; }
  }

  /* === VARIATIONS === */
  .variations {
    display: flex;
    gap: 48px;
    margin-top: 80px;
    z-index: 1;
  }

  .var-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px;
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
  }

  .var-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  /* Light version */
  .var-light {
    background: rgba(255,255,255,0.95);
    border-color: #E8EAED;
  }
  .var-light .var-label { color: #8B949E; }
  .var-light .wm-light {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #00C3FF 0%, #F3A6FF 50%, #35C838 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .var-light .wm-light-sub {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #8B949E;
  }

  /* Icon only */
  .var-icon svg { width: 64px; height: auto; }

  /* Compact horizontal */
  .var-horiz {
    flex-direction: row;
    gap: 12px;
    align-items: center;
  }
  .var-horiz svg { width: 36px; height: auto; }
  .var-horiz .wm-h {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #00C3FF, #F3A6FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Pulse on the eye pupil */
  @keyframes pupilPulse {
    0%, 100% { r: 39.85; opacity: 1; }
    50% { r: 35; opacity: 0.85; }
  }

  /* Ring animation */
  @keyframes ringExpand {
    0% { r: 39.85; opacity: 0.4; stroke-width: 2; }
    100% { r: 65; opacity: 0; stroke-width: 0.5; }
  }
</style>
</head>

      <defs>
        <!-- Main animated gradient -->
        <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">

          </stop>
        </linearGradient>

        <!-- Eye gradient (separate cycle) -->
        <radialGradient id="eyeGrad" cx="50%" cy="50%" r="60%">
          <stop offset="0%">
            <animate attributeName="stop-color" values="#FFFFFF;#F3A6FF;#66DAFF;#FFFFFF" dur="6s" repeatCount="indefinite"/>

            <animate attributeName="stop-color" values="#00C3FF;#35C838;#F3A6FF;#00C3FF" dur="6s" repeatCount="indefinite"/>
          </stop>
          <stop offset="100%">
            <animate attributeName="stop-color" values="#0088B0;#1A7A1C;#A060C0;#0088B0" dur="6s" repeatCount="indefinite"/>
          </stop>
        </radialGradient>

        <!-- 3D highlight gradient for depth -->
        <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>

          <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,195,255,0.3)"/>
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.4)"/>
        </filter>

        <!-- Inner glow -->
        <filter id="innerGlow">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
          <feOffset dx="0" dy="0"/>
          <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
          <feFlood flood-color="#00C3FF" flood-opacity="0.3"/>
          <feComposite in2="blur" operator="in"/>
          <feMerge>
            <feMergeNode/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- Bevel/emboss for 3D -->
        <filter id="bevel">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
          <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.75" specularExponent="20" result="specOut">
            <fePointLight x="150" y="50" z="200"/>
          </feSpecularLighting>
          <feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
          <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
        </filter>
      </defs>
